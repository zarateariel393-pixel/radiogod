<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061426">
  <title>RadioGOD - FM de los Dioses</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0; padding: 18px 12px; font-family: 'Poppins', sans-serif; color: #fff;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
      background: radial-gradient(circle at 50% 15%, rgba(19,67,104,.32), transparent 35%),
                  linear-gradient(145deg, #020914 0%, #061426 48%, #020811 100%);
    }
    .player-container {
      width: min(100%, 430px); overflow: hidden; position: relative; text-align: center;
      border-radius: 25px; background: linear-gradient(180deg, rgba(7,22,39,.98), rgba(3,12,25,.99));
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 24px 60px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.04);
    }
    .cover-container {
      position: relative; width: 100%; aspect-ratio: 4 / 3; max-height: 330px;
      overflow: hidden; background: #020914;
    }
    .cover-image {
      width: 100%; height: 100%; display: block; object-fit: cover; object-position: center;
    }
    .cover-container::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,.12) 0%, transparent 55%, #061021 100%);
      pointer-events: none;
    }
    .live-badge {
      position: absolute; z-index: 8; top: 14px; right: 14px; display: inline-flex;
      align-items: center; gap: 8px; padding: 8px 13px; border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px; background: linear-gradient(135deg, #ff3b46, #d90818);
      color: #fff; font-size: .74rem; font-weight: 800; letter-spacing: 1px;
      box-shadow: 0 8px 22px rgba(255,24,40,.45);
    }
    .live-badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
    .radio-info { position: relative; z-index: 5; margin-top: -18px; padding: 0 22px; }
    .location-badge {
      display: inline-block; padding: 5px 13px; border-radius: 18px; color: #c9ff18;
      font-size: .9rem; font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase;
    }
    .radio-info h1 { margin: 8px 0 0; font-size: clamp(1.5rem, 6vw, 1.85rem); font-weight: 800; color: #fff; }
    .station-name { display: block; margin-top: 5px; margin-bottom: 17px; color: #11d9ff; font-size: .91rem; font-weight: 600; }
    .equalizer { display: flex; align-items: center; justify-content: center; gap: 4px; height: 44px; margin-bottom: 12px; }
    .eq-bar { width: 4px; border-radius: 999px; background: linear-gradient(to top, #00aee8, #8ff6ff); animation: proBounce .78s infinite ease-in-out; animation-play-state: paused; }
    .eq-bar:nth-child(1) { height: 12px; animation-delay: -.68s; }
    .eq-bar:nth-child(2) { height: 22px; animation-delay: -.55s; }
    .eq-bar:nth-child(3) { height: 31px; animation-delay: -.42s; }
    .eq-bar:nth-child(4) { height: 38px; animation-delay: -.29s; }
    .eq-bar:nth-child(5) { height: 28px; animation-delay: -.16s; }
    .eq-bar:nth-child(6) { height: 40px; animation-delay: -.03s; }
    .eq-bar:nth-child(7) { height: 30px; animation-delay: -.22s; }
    @keyframes proBounce { 0%, 100% { transform: scaleY(.30); opacity: .38; } 50% { transform: scaleY(1); opacity: 1; } }
    .controls-wrapper { padding: 0 25px 25px; }
    .controls { display: flex; justify-content: center; margin-bottom: 19px; }
    #playPauseBtn {
      width: 76px; height: 76px; border: 1px solid rgba(255,255,255,.28); border-radius: 50%;
      cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 28px; color: #fff;
      background: linear-gradient(145deg, #23ddff, #008fd1); box-shadow: 0 10px 30px rgba(0,210,255,.45);
    }
    #playPauseBtn:focus-visible, .volume-slider:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    #playPauseBtn:disabled { opacity: .65; cursor: wait; }
    .volume-container {
      display: flex; align-items: center; gap: 12px; padding: 11px 15px; margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,.07); border-radius: 15px; background: rgba(255,255,255,.035);
    }
    .volume-slider { width: 100%; height: 5px; appearance: none; border-radius: 10px; background: #18cfff; cursor: pointer; }
    .status-indicator { display: flex; align-items: center; justify-content: center; gap: 9px; font-size: .78rem; font-weight: 600; min-height: 24px; }
    .live-dot { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; background: #ff4b5c; }
    .hint { margin: 12px 0 0; color: #91a8bd; font-size: .7rem; line-height: 1.5; }
    @media (prefers-reduced-motion: reduce) { .eq-bar { animation: none; } }
  </style>
</head>

    <section class="radio-info">
      <span class="location-badge">Quitilipi - Chaco</span>

      <span class="station-name">FM de los Dioses · 105.7 FM</span>
      <div class="equalizer" aria-hidden="true">
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>

      </div>

    <section class="controls-wrapper">
      <div class="controls">
        <button id="playPauseBtn" type="button" aria-label="Reproducir radio" title="Reproducir">▶</button>
      </div>
      <div class="volume-container">
        <span aria-hidden="true">🔊</span>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.8" aria-label="Volumen">
      </div>
      <div class="status-indicator" role="status" aria-live="polite">
        <span class="live-dot" id="liveDot"></span>
        <span id="statusText">Listo para transmitir</span>
      </div>

  <audio id="radioPlayer" preload="none"></audio>
  <script>
    (() => {
      'use strict';
      const STREAM_URL = 'http://uk25freenew.listen2myradio.com:8782/;';
      const playPauseBtn = document.getElementById('playPauseBtn');
      const radioPlayer = document.getElementById('radioPlayer');
      const volumeSlider = document.getElementById('volumeSlider');
      const statusText = document.getElementById('statusText');
      const liveDot = document.getElementById('liveDot');
      const eqBars = document.querySelectorAll('.eq-bar');
      let isLoading = false;

      radioPlayer.volume = Number(volumeSlider.value);

      function setStatus(message, color = '#ff4b5c') {
        statusText.textContent = message;
        liveDot.style.background = color;
      }
      function setPlaying(playing) {
        playPauseBtn.textContent = playing ? '❚❚' : '▶';
        playPauseBtn.setAttribute('aria-label', playing ? 'Pausar radio' : 'Reproducir radio');
        playPauseBtn.title = playing ? 'Pausar' : 'Reproducir';
        eqBars.forEach(bar => bar.style.animationPlayState = playing ? 'running' : 'paused');
      }

      playPauseBtn.addEventListener('click', async () => {
        if (!radioPlayer.paused) {
          radioPlayer.pause();
          return;
        }
        if (isLoading) return;
        isLoading = true;
        playPauseBtn.disabled = true;
        setStatus('Conectando con la radio…', '#ffc857');
        try {
          if (!radioPlayer.src || !radioPlayer.src.startsWith(STREAM_URL)) {
            radioPlayer.src = STREAM_URL;
          }
          await radioPlayer.play();
          setStatus('Transmitiendo en vivo', '#20dcff');
          setPlaying(true);
        } catch (error) {
          setPlaying(false);
          setStatus('No se pudo conectar. Revisá la señal o el enlace.', '#ff4b5c');
        } finally {
          isLoading = false;
          playPauseBtn.disabled = false;
        }
      });

      radioPlayer.addEventListener('playing', () => {
        setPlaying(true);
        setStatus('Transmitiendo en vivo', '#20dcff');
      });
      radioPlayer.addEventListener('pause', () => {
        setPlaying(false);
        if (radioPlayer.error) return;
        setStatus('Pausado', '#ff4b5c');
      });
      radioPlayer.addEventListener('waiting', () => setStatus('Cargando transmisión…', '#ffc857'));
      radioPlayer.addEventListener('error', () => {
        setPlaying(false);
        setStatus('Error de señal o enlace no disponible', '#ff4b5c');
      });
      volumeSlider.addEventListener('input', event => {
        radioPlayer.volume = Number(event.target.value);
      });
    })();
  </script>
